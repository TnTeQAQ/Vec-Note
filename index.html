<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- 首屏标题/按钮所用 Montserrat（仅拉丁 700/900）：随文档预加载，
         配合 font-display: optional 消除字体替换闪烁 -->
    <link
      rel="preload"
      href="/fonts/montserrat-latin-900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/montserrat-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      SEO template: the VEC_ placeholders below are replaced by the Cloudflare
      Worker per request path/host (src/worker/seo.ts). The client-side useSeo
      hook re-syncs these tags after hydration.
    -->
    <title>%VEC_TITLE%</title>
    <meta name="robots" content="index,follow" />
    <meta name="description" content="%VEC_DESCRIPTION%" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0f" />
    <link rel="canonical" href="%VEC_ORIGIN%%VEC_PATH%" />

    <!-- Open Graph -->
    <meta property="og:type" content="%VEC_OG_TYPE%" />
    <meta property="og:site_name" content="Vec-Note" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="%VEC_TITLE%" />
    <meta property="og:description" content="%VEC_DESCRIPTION%" />
    <meta property="og:url" content="%VEC_ORIGIN%%VEC_PATH%" />
    <meta property="og:image" content="%VEC_ORIGIN%/og.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VEC_TITLE%" />
    <meta name="twitter:description" content="%VEC_DESCRIPTION%" />
    <meta name="twitter:image" content="%VEC_ORIGIN%/og.svg" />

    <!-- 结构化数据（Worker 按页面注入；客户端导航时 useSeo 会替换） -->
    <script type="application/ld+json" id="seo-jsonld">%VEC_JSONLD%</script>

    <script>
      // 首屏绘制前确定主题，避免闪烁：
      // 1) 用户手动切换过 → 用 localStorage 中的显式选择；
      // 2) 否则跟随系统 prefers-color-scheme；
      // 3) 再否则默认浅色。
      (function () {
        try {
          var saved = localStorage.getItem('vec-note:theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* storage / matchMedia 不可用时保持 CSS 默认浅色 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
